[project]
name = "controlproof"
version = "0.0.0"
description = "Actively test cloud security controls and emit assessor-ready evidence as OSCAL assessment results."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Govardhan" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added in the milestone that first uses them (ADR-0002).
dependencies = [
    "jsonschema>=4.25",
    "pydantic>=2.12",
    "pyyaml>=6.0.2",
    "regex>=2025.9",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-socket>=0.7",
    "ruff>=0.13",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0",
    "types-regex>=2025.9",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.9,<0.13"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
# Ruff would reformat Python code blocks inside Markdown docs; keep it out of them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors, including E722 (bare except)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "BLE", # blind except
    "PT",  # pytest style
    "S",   # bandit
]

[tool.ruff.lint.per-file-ignores]
# The repo scripts and their tests drive git through subprocess on purpose.
"scripts/*" = ["S603", "S607"]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--disable-socket"]
markers = [
    "integration: needs the AWS sandbox account, network or Docker; runs in its own CI job",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
